name: Build

on:
  push:
    branches: ['**', '!gh-pages']
  workflow_dispatch:
    inputs:
      force_unsigned:
        description: Build an unsigned IPA even when the signing secrets are configured
        type: boolean
        default: false

# Builds are never cancelled: main runs one at a time, every other run gets its own group.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'main' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: read

env:
  APP_BUNDLE_ID: com.leonardoramirezr.voicenotesbyleoneralabs
  APP_TITLE: Voice Notes by Leonera Labs
  SCHEME: VoiceNotes
  IPA_NAME: VoiceNotes.ipa
  XCODEGEN_VERSION: 2.46.0
  APP_ICON: App/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      # Secrets cannot be used in `if:` conditions, so they are exposed as environment variables.
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      FORCE_UNSIGNED: ${{ inputs.force_unsigned && 'true' || 'false' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Select Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi beta | sort -V | tail -n 1 || true)"
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 installation found on this runner"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          swift --version

      - name: Resolve signing mode
        id: mode
        run: python3 scripts/ci.py mode

      - name: Compute version
        id: version
        run: python3 scripts/ci.py version

      - name: Write App Store Connect key
        if: steps.mode.outputs.mode == 'signed'
        run: python3 scripts/asc.py write-key --out "$RUNNER_TEMP/AuthKey_${ASC_KEY_ID}.p8"

      - name: Validate App Store Connect access and devices
        if: steps.mode.outputs.mode == 'signed'
        run: python3 scripts/asc.py check

      - name: Install XcodeGen
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: |
          xcodegen --version
          xcodegen generate --spec project.yml

      - name: Test scripts
        run: python3 -m unittest discover -s scripts/tests

      - name: Check localization
        run: python3 scripts/check_strings.py

      - name: Test VoiceNotesCore
        run: swift test --package-path Packages/VoiceNotesCore

      - name: Test VoiceNotesSync
        run: swift test --package-path Packages/VoiceNotesSync

      - name: Snapshot development certificates
        id: serials
        if: steps.mode.outputs.mode == 'signed'
        run: |
          python3 scripts/asc.py keychain-serials > "$RUNNER_TEMP/dev-certs-before.txt"
          echo "Apple Development certificates in the keychain before the build: $(grep -c . "$RUNNER_TEMP/dev-certs-before.txt" || true)"

      - name: Archive (signed)
        if: steps.mode.outputs.mode == 'signed'
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
        run: |
          if command -v xcbeautify >/dev/null 2>&1; then format() { xcbeautify --renderer github-actions; }; else format() { cat; }; fi
          xcodebuild archive \
            -project VoiceNotes.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VoiceNotes.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            APP_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            VN_BUILD_NAME="$BUILD_NAME" \
            | format

      - name: Export Ad Hoc IPA
        if: steps.mode.outputs.mode == 'signed'
        run: |
          if command -v xcbeautify >/dev/null 2>&1; then format() { xcbeautify --renderer github-actions; }; else format() { cat; }; fi
          python3 scripts/ci.py export-options --team "$APPLE_TEAM_ID" --out "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/VoiceNotes.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | format
          ipa="$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)"
          mkdir -p "$RUNNER_TEMP/dist"
          cp "$ipa" "$RUNNER_TEMP/dist/$IPA_NAME"
          echo "IPA_PATH=$RUNNER_TEMP/dist/$IPA_NAME" >> "$GITHUB_ENV"

      - name: Verify Ad Hoc provisioning
        id: verify
        if: steps.mode.outputs.mode == 'signed'
        run: python3 scripts/verify_ipa.py "$IPA_PATH" --team "$APPLE_TEAM_ID" --bundle-id "$APP_BUNDLE_ID"

      - name: Build unsigned IPA
        if: steps.mode.outputs.mode == 'unsigned'
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          BUILD_NAME: ${{ steps.version.outputs.build_name }}
        run: |
          if command -v xcbeautify >/dev/null 2>&1; then format() { xcbeautify --renderer github-actions; }; else format() { cat; }; fi
          xcodebuild archive \
            -project VoiceNotes.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/VoiceNotes.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            APP_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            VN_BUILD_NAME="$BUILD_NAME" \
            | format
          mkdir -p "$RUNNER_TEMP/unsigned/Payload" "$RUNNER_TEMP/dist"
          cp -R "$RUNNER_TEMP/VoiceNotes.xcarchive/Products/Applications/VoiceNotes.app" "$RUNNER_TEMP/unsigned/Payload/"
          (cd "$RUNNER_TEMP/unsigned" && zip -qry "$RUNNER_TEMP/dist/VoiceNotes-unsigned.ipa" Payload)
          echo "IPA_PATH=$RUNNER_TEMP/dist/VoiceNotes-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        if: env.IPA_PATH != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.version.outputs.tag }}
          path: ${{ env.IPA_PATH }}
          retention-days: 14
          if-no-files-found: error

      - name: Resolve GitHub Pages URL
        id: pages
        if: steps.mode.outputs.mode == 'signed'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          base="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null || true)"
          if [ -z "$base" ]; then
            base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          fi
          echo "base_url=$base" >> "$GITHUB_OUTPUT"
          python3 scripts/pages_site.py urls --base-url "$base" --tag "$TAG" | tee -a "$GITHUB_OUTPUT"

      - name: Render install icons
        if: steps.mode.outputs.mode == 'signed'
        run: |
          sips -z 57 57 "$APP_ICON" --out "$RUNNER_TEMP/icon-57.png" >/dev/null
          sips -z 512 512 "$APP_ICON" --out "$RUNNER_TEMP/icon-512.png" >/dev/null

      - name: Publish to GitHub Pages
        id: publish
        if: steps.mode.outputs.mode == 'signed'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          BRANCH: ${{ steps.version.outputs.branch }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          DEVICES: ${{ steps.verify.outputs.devices }}
        run: |
          scripts/publish-pages.sh \
            --tag "$TAG" \
            --channel "$CHANNEL" \
            --ipa "$IPA_PATH" \
            --icon57 "$RUNNER_TEMP/icon-57.png" \
            --icon512 "$RUNNER_TEMP/icon-512.png" \
            --base-url "$BASE_URL" \
            --title "$APP_TITLE" \
            --bundle-id "$APP_BUNDLE_ID" \
            --version "$MARKETING_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --branch "$BRANCH" \
            --sha "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --devices "$DEVICES"

      - name: Create GitHub release
        if: steps.mode.outputs.mode == 'signed'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          BRANCH: ${{ steps.version.outputs.branch }}
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
          INSTALL_URL: ${{ steps.pages.outputs.install_url }}
          DEVICES: ${{ steps.verify.outputs.devices }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          python3 scripts/ci.py release-notes \
            --tag "$TAG" --channel "$CHANNEL" --page-url "$PAGE_URL" --install-url "$INSTALL_URL" \
            --branch "$BRANCH" --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --devices "$DEVICES" --out "$notes" > /dev/null
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_PATH" --clobber
            gh release edit "$TAG" --notes-file "$notes"
          elif [ "$CHANNEL" = "stable" ]; then
            gh release create "$TAG" "$IPA_PATH" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$notes" --latest
          else
            gh release create "$TAG" "$IPA_PATH" --target "$GITHUB_SHA" --title "$TAG" --notes-file "$notes" \
              --prerelease --latest=false
          fi

      - name: Job summary
        if: always()
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          TAG: ${{ steps.version.outputs.tag }}
          CHANNEL: ${{ steps.version.outputs.channel }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          DEVICES: ${{ steps.verify.outputs.devices }}
          PUBLISHED: ${{ steps.publish.outcome }}
          PAGE_URL: ${{ steps.pages.outputs.page_url }}
          INSTALL_URL: ${{ steps.pages.outputs.install_url }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          {
            echo "## ${APP_TITLE} — \`${TAG}\`"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Build | \`${TAG}\` (${CHANNEL:-unknown}) |"
            echo "| Signing | ${MODE:-unknown} |"
            echo "| Version | ${MARKETING_VERSION} (${BUILD_NUMBER}) |"
            if [ -n "$DEVICES" ]; then echo "| Ad Hoc devices | ${DEVICES} |"; fi
            echo ""
            if [ "$PUBLISHED" = "success" ]; then
              echo "**Install on iPhone (open in Safari):** [${PAGE_URL}](${PAGE_URL})"
              echo ""
              echo "All builds: [${BASE_URL}](${BASE_URL})"
              echo ""
              echo "Direct install URL:"
              echo ""
              echo '```'
              echo "${INSTALL_URL}"
              echo '```'
            elif [ "$MODE" = "unsigned" ]; then
              echo "Unsigned IPA uploaded as a workflow artifact; nothing was published to GitHub Pages."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Revoke temporary development certificates
        if: always() && steps.serials.outcome == 'success'
        run: python3 scripts/asc.py revoke-new-dev-certs --before "$RUNNER_TEMP/dev-certs-before.txt"

      - name: Remove App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
